name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: Formato, pruebas y cobertura
        run: ./mvnw -B -ntp verify

  security:
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: Cache de la base de datos de dependency-check
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: dependency-check-data-
      - name: Escaneo de vulnerabilidades (falla con CVSS >= 7)
        run: ./mvnw -B -ntp verify -Psecurity

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Variables de ejemplo
        run: cp .env.example .env
      - name: Levantar app, PostgreSQL y Jaeger
        run: docker compose up --build -d
      - name: Esperar a que /actuator/health responda UP
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "app UP"; exit 0
            fi
            sleep 5
          done
          echo "La app no llego a UP"; exit 1
      - name: Smoke test
        run: bash scripts/smoke-test.sh
      - name: Logs si algo fallo
        if: failure()
        run: docker compose logs --no-color
      - name: Apagar y limpiar
        if: always()
        run: docker compose down -v

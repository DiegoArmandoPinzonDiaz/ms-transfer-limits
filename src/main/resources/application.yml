spring:
  application:
    name: ms-transfer-limits
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/transferlimits}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    sampling:
      probability: 1.0

spring:
  application:
    name: ms-transfer-limits
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/transferlimits}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          transport: http
  otlp:
    metrics:
      export:
        enabled: false

logging:
  pattern:
    # traceId y spanId en cada linea de log; nunca se loguean accountId ni montos.
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
